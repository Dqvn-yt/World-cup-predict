<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Data-driven football form and match prediction dashboard">
  <title>{% block title %}Football Analytics AI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}"><span>FA</span> Football Analytics</a>
    <button class="nav-toggle" type="button" aria-label="Toggle navigation" data-nav-toggle>Menu</button>
    <nav class="main-nav" data-nav>
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('player_list') }}">Players</a>
      <a href="{{ url_for('match_list') }}">Matches</a>
      <a href="{{ url_for('predict_match_page') }}">Predict</a>
      <a href="{{ url_for('compare') }}">Compare</a>
      <a href="{{ url_for('models_page') }}">About</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <span>Football Analytics AI</span>
    <span>Position form · Poisson scores · Goal probability</span>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
